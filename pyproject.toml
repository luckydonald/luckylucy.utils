[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luckydonald-utils"
version = "0.84"
description = "A collection of utilities I use across different projects"
readme = "README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "luckydonald", email = "code_utils@luckydonald.de" }]
requires-python = ">=3.8"
keywords = [
    "luckydonald", "utils", "utilities", "utility", "python", "dependencies", "dependency", "download", "progress",
    "bar", "encoding", "files", "interactions", "json", "update", "store", "text", "xml", "time", "network", "logger",
    "color", "images", "webserver", "django", "CSRF", "headers", "eastereggs", "decorator", "holder", "assert",
    "raise", "is None", "ponies", "pony",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
]
dependencies = ["pip", "setuptools", "DictObject"]

[project.urls]
Homepage = "https://github.com/luckydonald/luckydonald-utils"

[dependency-groups]
dev = ["bump-my-version", "twine", "keyring"]

[tool.setuptools.packages.find]
include = ["luckylucy.utils", "luckylucy.utils.*"]
