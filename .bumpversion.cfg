[bumpversion]
current_version = 1.85.pre1
commit = True
tag = True
parse = (?P<minor>\d+)\.(?P<patch>\d+)(?:\.(?P<pre>pre\d))?
serialize =
	{minor}.{patch}
	{minor}.{patch}.{pre}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"
[bumpversion:file:README.md]

